name: Release Native Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release --bin mcp-server --locked

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Release Features
        run: |
          python tests/test_upgrade_integration.py
          python tests/test_e2e_recovery.py
          python tests/test_usb_lab.py

      - name: Package Portable Windows Toolkit
        shell: pwsh
        run: |
          $bundle = "resc-$env:GITHUB_REF_NAME-windows-x64.zip"
          git archive --format=zip --output=$bundle HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::Open((Join-Path $env:GITHUB_WORKSPACE $bundle), 'Update')
          try {
            [void][IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive, "$env:GITHUB_WORKSPACE/target/release/mcp-server.exe", 'target/release/mcp-server.exe')
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$env:GITHUB_WORKSPACE/$bundle.sha256", "$hash  $bundle`n")

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/mcp-server.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE/target/release/mcp-server.exe.sha256", "$hash  mcp-server.exe`n")

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/mcp-server.exe
            target/release/mcp-server.exe.sha256
            resc-*-windows-x64.zip
            resc-*-windows-x64.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: docs/releases/v0.2.0.md
